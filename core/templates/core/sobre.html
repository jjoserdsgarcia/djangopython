{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Helpdesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1">💻 Helpdesk</span>
        </div>
    </nav>

    <!-- CONTEÚDO -->
    <div class="container mt-4">

        <!-- TÍTULO -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold">BOM DIA</h2>
            <a href="{% url 'BemVindo' %}" class="btn btn-primary shadow-sm so-um-nome">Voltar</a>
        </div>

        <!-- CARD -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white">
                <h5 class="mb-0">📋 Lista de Chamados</h5>
            </div>

            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">

                        <thead class="table-dark">
                            <tr>
                                <th>Lab</th>
                                <th>Problema</th>
                                <th>Prioridade</th>
                            </tr>
                        </thead>

                        <tbody>
                            {% for c in chamados %}

                            <tr class="
                            {% if c.prioridade == 'Alta' %}
                                table-danger
                            {% elif c.prioridade == 'Média' %}
                                table-warning
                            {% else %}
                                table-success
                            {% endif %}
                        ">

                                <td class="fw-semibold">{{ c.lab }}</td>
                                <td>{{ c.problema }}</td>

                                <td>
                                    <span class="badge
                                    {% if c.prioridade == 'Alta' %}
                                        bg-danger
                                    {% elif c.prioridade == 'Média' %}
                                        bg-warning text-dark
                                    {% else %}
                                        bg-success
                                    {% endif %}
                                ">
                                        {{ c.prioridade }}
                                    </span>
                                </td>

                            </tr>

                            {% empty %}
                            <tr>
                                <td colspan="3" class="text-center text-muted">
                                    Nenhum chamado encontrado
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>

                    </table>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

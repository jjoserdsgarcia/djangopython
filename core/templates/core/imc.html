<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Calculadora de IMC</title>
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4" style="width: 350px; border-radius: 15px;">
        <h2 class="text-center mb-4">💪 Calculadora de IMC</h2>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="peso" class="form-label">Peso (kg)</label>
                <input type="text" id="peso" name="peso" class="form-control" placeholder="Ex: 70">
            </div>

            <div class="mb-3">
                <label for="altura" class="form-label">Altura (m)</label>
                <input type="text" id="altura" name="altura" class="form-control" placeholder="Ex: 1.75">
            </div>

            <button type="submit" class="btn btn-primary w-100">Calcular</button>
        </form>

        {% if imc %}

        <div class="alert alert-success text-center mt-4">
            <h5>Seu IMC é:</h5>
            <strong>{{ imc }}</strong>
        </div>
        {% endif %}
    </div>

</body>

</html>
